<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stepwise</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230d6e66'/%3E%3Cpath d='M5 17h4.5v-4.5H14V8h5' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="top" id="top"></header>
    <nav class="side" aria-label="Test cases and blocks">
      <div class="side-search">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Search cases, steps, tags" aria-label="Search">
      </div>
      <div class="side-list" id="side"></div>
    </nav>
    <main class="main" id="main"></main>
    <section class="term" id="term" aria-label="Claude Code" hidden>
      <div class="term-resize" id="term-resize" role="separator" aria-orientation="horizontal" aria-label="Resize the Claude Code panel" tabindex="0"></div>
      <div class="term-head" id="term-head"></div>
      <div class="term-note" id="term-note" hidden></div>
      <div class="term-body" id="term-body"></div>
    </section>
    <aside class="panel" id="panel" aria-label="Details"></aside>
  </div>
  <div class="scrim" id="scrim"></div>
  <div class="menu" id="switcher" popover="auto" aria-label="Switch folder"></div>
  <dialog id="dialog"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="core.js"></script>
  <script src="sample.js"></script>
  <script src="workspace.js"></script>
  <script src="app.js"></script>
</body>
</html>
