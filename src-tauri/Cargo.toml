[package]
name = "stepwise"
version = "0.2.0"
description = "A desktop editor for Azure DevOps manual test cases that works with your AI assistant."
authors = ["WebbontheWeb"]
license = "MIT"
repository = "https://github.com/WebbontheWeb/stepwise"
edition = "2024"
rust-version = "1.90"

[lib]
name = "stepwise_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
notify-debouncer-mini = "0.7"
dunce = "1"
tempfile = "3"
